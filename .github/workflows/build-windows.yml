name: Build BAJAMA Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare release version and output folder
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected release tag: $env:GITHUB_REF_NAME" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "clients/windows/publish/win-x64"
          dotnet publish clients/windows/Bajama.Windows/Bajama.Windows.csproj --configuration Release --runtime win-x64 --self-contained true "-p:Version=$env:APP_VERSION" -p:PublishReadyToRun=true "-p:PublishDir=$publishDir\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $publishExe = Join-Path $env:GITHUB_WORKSPACE "clients/windows/publish/win-x64/Bajama.Windows.exe"
          if (-not (Test-Path $publishExe)) { throw "Published BAJAMA executable not found: $publishExe" }
          Write-Host "Compiling installer for version $env:APP_VERSION"
          Write-Host "Published app: $publishExe"
          Write-Host "Installer output: $env:GITHUB_WORKSPACE\artifacts"
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "clients/windows/installer")
          $compilerExitCode = 0
          try {
            & $iscc "/DAppVersion=$env:APP_VERSION" "/O$env:GITHUB_WORKSPACE\artifacts" "Bajama.iss"
            $compilerExitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($compilerExitCode -ne 0) { throw "Inno Setup compiler exited with code $compilerExitCode" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: bajama-windows-installer-win-x64
          path: artifacts/BAJAMA-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 30
